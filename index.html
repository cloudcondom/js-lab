<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Планировщик Расписания</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">JS Project</p>
      <h1>Планировщик расписания </h1>
      <p class="subtitle">Удобный планировщик событий с поиском, фильтрацией и сортировкой.</p>
    </div>
  </header>

  <main class="container">
    <section class="panel form-panel">
      <h2>Добавить события</h2>
      <form id="eventForm" novalidate>
        <div class="form-grid">
          <label>
            Название события
            <input id="titleInput" type="text" placeholder="Например: Лекция по JS" />
            <span class="error" id="titleError"></span>
          </label>

          <label>
            Дата
            <input id="dateInput" type="date" />
            <span class="error" id="dateError"></span>
          </label>

          <label>
            Время
            <input id="timeInput" type="time" />
            <span class="error" id="timeError"></span>
          </label>

          <label>
            Категория
            <select id="categoryInput">
              <option value="">Выберите категорию</option>
              <option value="Учёба">Учёба</option>
              <option value="Работа">Работа</option>
              <option value="Личное">Личное</option>
              <option value="Другое">Другое</option>
            </select>
            <span class="error" id="categoryError"></span>
          </label>
        </div>

        <label>
          Описание
          <textarea id="descriptionInput" rows="3" placeholder="Краткое описание события"></textarea>
        </label>

        <button class="primary-btn" type="submit">Добавить</button>
      </form>
    </section>

    <section class="panel controls-panel">
      <div class="controls">
        <label>
          Поиск
          <input id="searchInput" type="search" placeholder="Найти событие..." />
        </label>

        <label>
          Фильтр
          <select id="filterCategory">
            <option value="all">Все категории</option>
            <option value="Учёба">Учёба</option>
            <option value="Работа">Работа</option>
            <option value="Личное">Личное</option>
            <option value="Другое">Другое</option>
          </select>
        </label>

        <label>
          Сортировка
          <select id="sortSelect">
            <option value="dateAsc">Дата: сначала ближайшие</option>
            <option value="dateDesc">Дата: сначала поздние</option>
            <option value="titleAsc">Название: А-Я</option>
          </select>
        </label>
      </div>
    </section>

    <section class="events-section">
      <div class="section-title">
        <h2>Список событий</h2>
        <span id="eventCounter">0 событий</span>
      </div>
      <div id="eventsList" class="events-list"></div>
      <p id="emptyMessage" class="empty-message">Пока нет событий. Добавьте первое событие выше.</p>
    </section>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <button id="closeModal" class="close-btn" type="button">×</button>
      <h2>Редактировать событие</h2>
      <form id="editForm" novalidate>
        <input id="editId" type="hidden" />

        <label>
          Название
          <input id="editTitle" type="text" />
          <span class="error" id="editTitleError"></span>
        </label>

        <label>
          Дата
          <input id="editDate" type="date" />
          <span class="error" id="editDateError"></span>
        </label>

        <label>
          Время
          <input id="editTime" type="time" />
          <span class="error" id="editTimeError"></span>
        </label>

        <label>
          Категория
          <select id="editCategory">
            <option value="">Выберите категорию</option>
            <option value="Учёба">Учёба</option>
            <option value="Работа">Работа</option>
            <option value="Личное">Личное</option>
            <option value="Другое">Другое</option>
          </select>
          <span class="error" id="editCategoryError"></span>
        </label>

        <label>
          Описание
          <textarea id="editDescription" rows="3"></textarea>
        </label>

        <button class="primary-btn" type="submit">Сохранить</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Учёт финансов — Лаб. №5</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

      <h1> Учёт личных финансов</h1>
      <p class="subtitle">Лабораторная работа №5</p>

      <!-- Баланс -->
      <div class="balance-card">
        <span class="label">Общий баланс</span>
        <span id="total" class="total-positive">+0.00 MDL</span>
      </div>

      <!-- Форма добавления транзакции -->
      <div class="form-card">
        <h2>Новая транзакция</h2>
        <form id="transaction-form">
          <div class="form-row">

            <div class="form-group">
              <label for="amount">Сумма (mdl)</label>
              <input
                type="number"
                id="amount"
                placeholder="напр. -500 или 3000"
              />
            </div>

            <div class="form-group">
              <label for="category">Категория</label>
              <select id="category">
                <option value="">— выберите —</option>
                <option value="Зарплата">Зарплата</option>
                <option value="Фриланс">Фриланс</option>
                <option value="Еда">Еда</option>
                <option value="Транспорт">Транспорт</option>
                <option value="Жильё">Жильё</option>
                <option value="Развлечения">Развлечения</option>
                <option value="Здоровье">Здоровье</option>
                <option value="Прочее">Прочее</option>
              </select>
            </div>

            <div class="form-group">
              <label for="description">Описание</label>
              <input
                type="text"
                id="description"
                placeholder="Подробное описание транзакции"
              />
            </div>

            <button type="submit" class="btn-submit">Добавить</button>

          </div>
        </form>
      </div>

      <!-- Таблица транзакций -->
      <div class="table-wrapper">
        <table id="transactions-table">
          <thead>
            <tr>
              <th>Дата и время</th>
              <th>Категория</th>
              <th>Описание</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Блок деталей транзакции -->
      <div id="details"></div>

    </div>

    <script type="module" src="src/index.js"></script>
  </body>
</html>
